name: Build restored v0.2.6 image

on:
  workflow_dispatch:
  push:
    branches: [preserved-49a39b6]
    paths: [.github/workflows/preserved-image.yml]

permissions:
  contents: read
  packages: write

concurrency:
  group: preserved-49a39b6-image
  cancel-in-progress: false

env:
  SOURCE_SHA: 8b69738d782ccaa7fd26511e1cca26ba8d1b58db
  SOURCE_TREE: 3609a08fccf1f37761fbeaba768cee2f2e599660

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the restored v0.2.6 source snapshot
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify source and prepare image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(cat backend/cmd/server/VERSION)" = "0.2.6"
          test -z "$(git status --porcelain)"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish both architectures
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:v0.2.6
          build-args: |
            VERSION=0.2.6
            COMMIT=${{ env.SOURCE_SHA }}
            DATE=${{ steps.meta.outputs.date }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=0.2.6
            org.opencontainers.image.description=Independent build of upstream v0.2.6 before rollback
          cache-from: type=gha,scope=preserved-49a39b6
          cache-to: type=gha,mode=max,scope=preserved-49a39b6

      - name: Verify manifest and executables
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          ref="$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$ref" --raw > manifest.json
          for arch in amd64 arm64; do
            jq -e --arg arch "$arch" '.manifests | any(.platform.os == "linux" and .platform.architecture == $arch)' manifest.json
            platform_digest=$(jq -er --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' manifest.json)
            docker run --rm --platform "linux/$arch" --entrypoint /app/sub2api "$IMAGE@$platform_digest" -version 2>&1 | tee "version-$arch.txt"
            grep -F "Sub2API 0.2.6 (commit: $SOURCE_SHA," "version-$arch.txt"
          done
          {
            echo '### Restored Sub2API v0.2.6 image'
            echo
            echo "Source: $SOURCE_SHA"
            echo
            echo "Platforms: linux/amd64, linux/arm64"
            echo
            echo '```bash'
            echo "docker pull $IMAGE:v0.2.6"
            echo "docker pull $ref"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
