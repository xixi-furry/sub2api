name: Build Fur Code v0.2.7-fur.1 with 292 tickets

on:
  workflow_dispatch:
  push:
    branches: [preserved-49a39b6]
    paths: [.github/workflows/preserved-image.yml]

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: preserved-49a39b6-image
  cancel-in-progress: false

env:
  SOURCE_SHA: e1581ded30259bc78b490ca50f448628c92fc43f
  SOURCE_TREE: b5886c442e99d62e974a9b6ad3ee0629d8d1409c

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout v0.2.7-fur.1 with preserved 292 tickets
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify source and prepare image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(cat backend/cmd/server/VERSION)" = "0.2.7"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD:backend)" = "57d5ade8066d4b3a313c0e2254252a2e89e9d2a3"
          test "$(git rev-parse HEAD:frontend/src/views/admin)" = "3d2a3dd39bb30619c2fbf20eef32d156b6e07964"
          test "$(git rev-parse HEAD:frontend/src/views/user)" = "da00ce0e7b3613728dac498f4a2d81313df9676d"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Wait for the exact source CI to pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            result=$(curl --fail --silent --show-error --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/35429022291")
            test "$(jq -r '.head_sha' <<< "$result")" = "$SOURCE_SHA"
            if [ "$(jq -r '.status' <<< "$result")" = "completed" ]; then
              test "$(jq -r '.conclusion' <<< "$result")" = "success"
              exit 0
            fi
            echo "Waiting for source CI (attempt $attempt/90)"
            sleep 20
          done
          echo "Source CI did not complete within 30 minutes" >&2
          exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Verify homepage, login, and preserved account UI regressions
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run src/components/account/__tests__/AccountUsageCell.spec.ts src/components/account/__tests__/EditAccountModal.spec.ts src/components/account/__tests__/BulkEditAccountModal.spec.ts src/views/admin/__tests__/SettingsView.spec.ts src/components/fur-code/__tests__/FurCodeHome.spec.ts src/views/__tests__/HomeView.compact.spec.ts src/views/auth/__tests__/LoginView.spec.ts src/components/auth/__tests__/TotpLoginModal.spec.ts src/components/auth/__tests__/OAuthLoginSections.spec.ts
          pnpm exec eslint src/components/fur-code src/views/HomeView.vue src/views/auth/LoginView.vue --ext .vue,.ts

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish both architectures
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:v0.2.7-fur.1
          build-args: |
            VERSION=0.2.7-fur.1
            COMMIT=${{ env.SOURCE_SHA }}
            DATE=${{ steps.meta.outputs.date }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=0.2.7-fur.1
            org.opencontainers.image.description=Fur Code home and login on upstream v0.2.7 with preserved built-in 292 tickets
          cache-from: type=gha,scope=preserved-49a39b6
          cache-to: type=gha,mode=max,scope=preserved-49a39b6

      - name: Verify manifest and executables
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          ref="$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$ref" --raw > manifest.json
          for arch in amd64 arm64; do
            jq -e --arg arch "$arch" '.manifests | any(.platform.os == "linux" and .platform.architecture == $arch)' manifest.json
            platform_digest=$(jq -er --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' manifest.json)
            docker run --rm --platform "linux/$arch" --entrypoint /app/sub2api "$IMAGE@$platform_digest" -version 2>&1 | tee "version-$arch.txt"
            grep -F "Sub2API 0.2.7-fur.1 (commit: $SOURCE_SHA," "version-$arch.txt"
          done
          {
            echo '### Sub2API v0.2.7-fur.1 with 292 tickets'
            echo
            echo "Source: $SOURCE_SHA"
            echo
            echo "Platforms: linux/amd64, linux/arm64"
            echo
            echo '```bash'
            echo "docker pull $IMAGE:v0.2.7-fur.1"
            echo "docker pull $ref"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
